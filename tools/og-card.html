<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('http://localhost:4322/assets/fonts/geist-sans-latin-400-normal.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Geist';
        src: url('http://localhost:4322/assets/fonts/geist-sans-latin-600-normal.woff2') format('woff2');
        font-weight: 600;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('http://localhost:4322/assets/fonts/geist-mono-latin-400-normal.woff2') format('woff2');
        font-weight: 400;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #08090a;
        color: #f4f5f6;
        font-family: 'Geist', sans-serif;
        position: relative;
        overflow: hidden;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      .glow {
        position: absolute;
        right: -180px;
        top: -160px;
        width: 720px;
        height: 720px;
        background: radial-gradient(circle, rgba(81,162,255,.14) 0%, rgba(81,162,255,0) 62%);
      }
      .frame {
        position: absolute;
        inset: 40px;
        border: 1px solid rgba(255,255,255,.09);
      }
      .mark {
        position: absolute;
        width: 9px;
        height: 9px;
        border: 1px solid rgba(255,255,255,.28);
      }
      .mark.tl { left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
      .mark.tr { right: -1px; top: -1px; border-left: 0; border-bottom: 0; }
      .mark.bl { left: -1px; bottom: -1px; border-right: 0; border-top: 0; }
      .mark.br { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }
      .inner {
        position: absolute;
        inset: 40px;
        padding: 74px 78px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand { display: flex; align-items: center; gap: 13px; }
      /* the source glyph is pure black on transparent */
      .brand img { width: 34px; height: 34px; object-fit: contain; filter: invert(1); }
      .brand span {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      h1 {
        font-size: 66px;
        font-weight: 600;
        line-height: 1.06;
        letter-spacing: -0.035em;
        max-width: 17ch;
      }
      h1 em { font-style: normal; color: #9ba1a6; }
      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: 'Geist Mono', monospace;
        font-size: 17px;
        letter-spacing: 0.06em;
        color: #6b7176;
        text-transform: uppercase;
      }
      .foot b { color: #51a2ff; font-weight: 400; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="frame">
      <i class="mark tl"></i><i class="mark tr"></i><i class="mark bl"></i><i class="mark br"></i>
    </div>
    <div class="inner">
      <div class="brand">
        <img src="http://localhost:4322/media/logo.png" alt="" />
        <span>Alphe</span>
      </div>
      <h1>The decision layer for AI infrastructure.</h1>
      <div class="foot">
        <span>One endpoint · 300+ models</span>
        <span><b>60–70%</b> less inference spend</span>
      </div>
    </div>
  </body>
</html>
